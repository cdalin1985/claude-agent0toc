version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint 8.x only accepts TypeScript below 6.1, so a TypeScript 7
      # bump breaks npm install for the whole dev-dependencies group. Remove this
      # once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
