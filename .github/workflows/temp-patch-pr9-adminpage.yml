name: Temp Patch PR9 AdminPage UI

on:
  push:
    branches:
      - feature/admin-player-activation-edge-function-slice-2

permissions:
  contents: write

jobs:
  patch-adminpage:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'Apply PR9 AdminPage UI wiring') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-player-activation-edge-function-slice-2

      - name: Patch AdminPage Players tab
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/AdminPage.tsx';
          let s = fs.readFileSync(path, 'utf8');

          s = s.replace(
            "  const [addLoading, setAddLoading] = useState(false);\n  const [addError, setAddError]     = useState('');",
            "  const [addLoading, setAddLoading] = useState(false);\n  const [addError, setAddError]     = useState('');\n  const [activeToggling, setActiveToggling] = useState<string | null>(null);\n  const [activeError, setActiveError] = useState('');"
          );

          s = s.replace(
            "  const toggleActive = async (p: Player) => {\n    await supabase.from('players').update({ is_active: !p.is_active }).eq('id', p.id);\n    qc.invalidateQueries({ queryKey: ['admin-players'] });\n  };",
            "  const toggleActive = async (p: Player) => {\n    setActiveToggling(p.id);\n    setActiveError('');\n    const { data: { session } } = await supabase.auth.getSession();\n    if (!session) {\n      setActiveError('Session expired — please log in again.');\n      setActiveToggling(null);\n      return;\n    }\n\n    try {\n      const res = await fetch(`${import.meta.env.VITE_SUPABASE_URL}/functions/v1/set-player-active`, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },\n        body: JSON.stringify({ player_id: p.id, is_active: !p.is_active }),\n      });\n      const json = await res.json().catch(() => ({}));\n      if (!res.ok || json.error) {\n        setActiveError(json.error ?? 'Could not update player status.');\n        return;\n      }\n      qc.invalidateQueries({ queryKey: ['admin-players'] });\n      qc.invalidateQueries({ queryKey: ['audit-events'] });\n    } catch {\n      setActiveError('Network error — please try again.');\n    } finally {\n      setActiveToggling(null);\n    }\n  };"
          );

          s = s.replace(
            "      )}\n\n      {/* Filter buttons */}",
            "      )}\n\n      {activeError && <p className=\"text-[#EF4444] text-xs font-[Barlow]\">{activeError}</p>}\n\n      {/* Filter buttons */}"
          );

          s = s.replace(
            "            <button onClick={() => toggleActive(p)}\n              className={`px-3 py-1.5 rounded-lg text-xs font-[Barlow] font-medium transition-colors ${p.is_active ? 'bg-[#EF4444]/20 text-[#EF4444] border border-[#EF4444]/30' : 'bg-[#22C55E]/20 text-[#22C55E] border border-[#22C55E]/30'}`}>\n              {p.is_active ? 'Deactivate' : 'Activate'}\n            </button>",
            "            <button onClick={() => toggleActive(p)} disabled={activeToggling === p.id}\n              className={`px-3 py-1.5 rounded-lg text-xs font-[Barlow] font-medium transition-colors disabled:opacity-60 disabled:cursor-not-allowed ${p.is_active ? 'bg-[#EF4444]/20 text-[#EF4444] border border-[#EF4444]/30' : 'bg-[#22C55E]/20 text-[#22C55E] border border-[#22C55E]/30'}`}>\n              {activeToggling === p.id ? 'Saving…' : p.is_active ? 'Deactivate' : 'Activate'}\n            </button>"
          );

          fs.writeFileSync(path, s);
          NODE

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/temp-patch-pr9-adminpage.yml
          git config user.name "toc-local-operator"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AdminPage.tsx .github/workflows/temp-patch-pr9-adminpage.yml
          git commit -m "Apply PR9 AdminPage UI wiring"
          git push origin feature/admin-player-activation-edge-function-slice-2
