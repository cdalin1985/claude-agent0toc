name: Claude Code Review

# DISABLED on PRs, deliberately. Re-enable by restoring the `pull_request:`
# block below -- but read this first, because it has never once worked and it
# was not free.
#
# It has never posted a review. Not one, across PRs #63-#78. Every run reported
# the check green, and green meant "the reviewer finished talking to itself".
#
# What was tried, in order, and what each cost:
#
#   baseline            5 turns   $0.19    1 denial    posted nothing
#   + --comment         5 turns   $0.19    1 denial    posted nothing
#   + --allowedTools   10 turns   $0.94    3 denials   posted nothing
#   (allowlist removed)
#   larger PR (#78)    35 turns   $3.59   35 denials   posted nothing
#
# --comment was necessary and not sufficient: without it the skill writes
# findings to stdout, which in CI goes nowhere. With it the reviewer forms a
# review and is then refused the tool that writes the comment, so it discards
# the review and exits green.
#
# --allowedTools made it worse. It REPLACES the permissive default rather than
# adding to it, so granting one tool removed the rest. Reverted.
#
# The last run denied all 35 of its 35 turns. The cost scales with the size of
# the diff, because a bigger PR means more attempts, all refused. That is an
# unbounded bill for zero output on every PR anyone opens, which is why this is
# off rather than merely noisy.
#
# The diagnostic step below still exists and still works. It prints the denial
# records from claude-execution-output.json, which the action writes and never
# surfaces. Run this workflow manually (Actions -> Claude Code Review -> Run
# workflow) against a branch to collect that output without billing every PR.
#
# Do not re-enable on `pull_request` until a run demonstrably posts a comment.
# A green check here does not mean the code was reviewed, and leaving it on
# taught exactly that.
#
# One more trap for whoever picks this up: a PR that edits THIS FILE is skipped
# by workflow validation -- the action requires the file to match the default
# branch so a PR cannot rewrite its own reviewer. It logs "Skipping action due
# to workflow validation", never starts Claude, and still reports success. Any
# change here can only be tested on the NEXT PR after it merges.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review (any PR, open or already merged)'
        required: true
        type: string

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the action's last step posts its findings as review
      # comments, and creating those needs write. With read it can look at the
      # diff and then fail to say anything about it -- a review that runs, goes
      # green, and produces nothing. That has not been the visible failure so
      # far (the run has been dying on its first turn since 2026-08-07), but it
      # is the failure that would have replaced it.
      pull-requests: write
      issues: read
      # So the reviewer can see whether CI passed on the PR it is reviewing.
      # claude.yml already grants this for the same reason.
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # A PR that edits THIS FILE cannot test this file.
          #
          # The action refuses to run when the workflow differs from the copy on
          # the default branch -- otherwise a PR could rewrite its own reviewer.
          # It logs "Skipping action due to workflow validation", never starts
          # Claude, and still reports the check as SUCCESS. So on any PR touching
          # this workflow the green tick means "did not run", and the only way to
          # test a change here is to merge it and watch the next PR.
          #
          # --comment is what makes this a review rather than an expensive no-op.
          #
          # Without it the skill writes its findings to stdout, and in CI stdout
          # goes nowhere. Measured across PRs #63-#69 on 2026-08-19: eight runs
          # reported `success` and posted zero reviews and zero comments between
          # them, at roughly $0.53 a run. The green tick meant "the reviewer
          # finished talking to itself".
          #
          # That is worse than a red check. A red one gets investigated; a green
          # one that produces nothing quietly certifies every PR it touches, and
          # teaches everyone that the tick means reviewed when it does not.
          # On workflow_dispatch there is no github.event.pull_request, so the
          # number comes from the input. Without this the manual run produced
          # ".../pull/" with nothing after it -- which is why the diagnostic
          # could not be exercised by hand while the PR trigger was off.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.inputs.pr || github.event.pull_request.number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The run reports `permission_denials_count` and nothing else: not which
      # tool, not what it was trying to do. Guessing at the name made it worse --
      # an --allowedTools list intended to grant one tool replaced the permissive
      # default instead, and denials went from 1 to 3.
      #
      # The detail is already written to claude-execution-output.json; it just
      # never reaches the log. This prints it, so the next run says what to allow
      # instead of inviting another guess.
      #
      # if: always() -- the interesting case is the run that failed.
      - name: Report which tools were denied
        if: always()
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$f" ]; then
            echo "No execution log at $f — the action skipped (workflow validation) or died before writing one."
            exit 0
          fi
          # Print the record whole rather than guessing its fields. The first
          # version asked for .tool_name and got "?" back: the denial record does
          # not carry that key, so the tool never got named and the guessing
          # would simply have continued one level deeper. Dump it and read what
          # is actually in there.
          echo "--- denial records, in full ---"
          jq -c '.. | objects | select((.permission_denied? == true) or (has("permission_denials")))' "$f" 2>/dev/null | head -20
          echo "--- every distinct key on any object (to find the name field) ---"
          jq -r '[.. | objects | keys[]] | unique | join(", ")' "$f" 2>/dev/null | fold -w 150
          echo "--- tool-ish values, by frequency ---"
          grep -oE '"(tool|tool_name|name|toolName|server)" *: *"[^"]+"' "$f" | sort | uniq -c | sort -rn | head -20 || true

