name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the action's last step posts its findings as review
      # comments, and creating those needs write. With read it can look at the
      # diff and then fail to say anything about it -- a review that runs, goes
      # green, and produces nothing. That has not been the visible failure so
      # far (the run has been dying on its first turn since 2026-08-07), but it
      # is the failure that would have replaced it.
      pull-requests: write
      issues: read
      # So the reviewer can see whether CI passed on the PR it is reviewing.
      # claude.yml already grants this for the same reason.
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # A PR that edits THIS FILE cannot test this file.
          #
          # The action refuses to run when the workflow differs from the copy on
          # the default branch -- otherwise a PR could rewrite its own reviewer.
          # It logs "Skipping action due to workflow validation", never starts
          # Claude, and still reports the check as SUCCESS. So on any PR touching
          # this workflow the green tick means "did not run", and the only way to
          # test a change here is to merge it and watch the next PR.
          #
          # --comment is what makes this a review rather than an expensive no-op.
          #
          # Without it the skill writes its findings to stdout, and in CI stdout
          # goes nowhere. Measured across PRs #63-#69 on 2026-08-19: eight runs
          # reported `success` and posted zero reviews and zero comments between
          # them, at roughly $0.53 a run. The green tick meant "the reviewer
          # finished talking to itself".
          #
          # That is worse than a red check. A red one gets investigated; a green
          # one that produces nothing quietly certifies every PR it touches, and
          # teaches everyone that the tick means reviewed when it does not.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

