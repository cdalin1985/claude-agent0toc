name: Migration deploy drift check

# Catches the exact gap that let three June-25 migrations (including the RLS
# privilege-escalation fix) sit merged on main but never applied to
# production: a merged migration file is not a deployed migration. Compares
# the migration filenames in this repo against the versions production
# actually has in supabase_migrations.schema_migrations and fails if any
# repo migration older than SKIP_RECENT_MINUTES is missing in prod.
#
# Requires a repo secret PROD_DB_URL: a Postgres connection string for the
# production database (read-only role is sufficient; it only SELECTs from
# supabase_migrations.schema_migrations).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This check reported nothing at all from June to August: the secret held
      # the IPv6-only direct host, psql could not connect, and the step had no
      # `set -e`, so an empty result set made every migration look missing. A
      # check that cannot connect is worse than no check, because it looks like
      # coverage. The script repairs the string at runtime and exports it masked.
      - name: Resolve a connection string this runner can reach
        id: db
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # TOC only. Project ankvjywsnydpkepdvuvm is "toc1". TOF is a separate
          # league in a separate project and must never be read from here.
          PROJECT_REF: ankvjywsnydpkepdvuvm
        run: |
          # GitHub runs this as `bash -e {0}`, and `set -uo pipefail` does not
          # clear the -e it was invoked with. Without `set +e` an unset secret
          # (exit 2) would fail this check outright instead of warning and
          # skipping, which is the one behaviour its test explicitly pins.
          set -uo pipefail
          set +e
          bash .github/scripts/resolve-prod-db-url.sh
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::PROD_DB_URL secret is not set; skipping deploy-drift check. Add it in repo settings to enable this gate."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Compare repo migrations against production schema_migrations
        if: steps.db.outputs.configured == 'true'
        run: |
          # Fail loudly on a failed query rather than treating an empty answer as
          # "production has no migrations", which is what made this check lie.
          set -euo pipefail

          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -At -c \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            > /tmp/remote-versions.txt

          # The comparison itself lives in a script so it can be run against
          # fixtures -- see test/migration-drift.test.mjs. It checks both
          # directions: repo-not-in-production (a merged migration that was
          # never deployed) and production-not-in-repo (SQL applied straight to
          # the database, which went unnoticed for three months).
          bash .github/scripts/compare-migrations.sh \
            supabase/migrations \
            /tmp/remote-versions.txt \
            .github/known-production-only-migrations.txt
