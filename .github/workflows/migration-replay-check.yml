name: Migration replay

# Two things static tests cannot do: prove every migration APPLIES, in filename
# order, to a database built from this repo alone; and prove the functions they
# install actually behave correctly.
#
# This caught a real one. 20260807120000 indexed challenges.match_deadline,
# which exists in production but appears nowhere in this repo's migration
# history -- so the migration worked against production and would have failed
# on any fresh build. Reviewing the SQL could not surface that; running it did
# so immediately.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/migrations/**'
      - '.github/workflows/migration-replay-check.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase's own Postgres image, not stock postgres:17. pg_net (and
        # pg_cron, pgjwt, ...) are Supabase-packaged extensions absent from
        # vanilla Postgres, so CREATE EXTENSION pg_net fails here on stock
        # postgres:17 even though it succeeds against every real Supabase
        # project, including toc1. Version matches production's major version.
        image: supabase/postgres:17.6.1.167
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Build the Supabase shim
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/migrations/00_supabase_shim.sql

      - name: Replay every migration in filename order
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--> $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Assert the league rules actually behave correctly
        run: |
          set -euo pipefail
          # Every assert file, by glob. Naming two explicitly meant that
          # 03_preferences, 04_definer_privileges and 05_treasury_visibility
          # existed, passed locally, and were never run by the PR gate -- so the
          # only genuinely behavioural coverage in the repo was the part CI
          # skipped. A new NN_*_assert.sql is now picked up automatically.
          shopt -s nullglob
          asserts=(supabase/tests/migrations/[0-9][0-9]_*_assert.sql)
          if [ ${#asserts[@]} -eq 0 ]; then
            echo "::error::No assert files matched. Refusing to report success from an empty set."
            exit 1
          fi
          for f in "${asserts[@]}"; do
            echo "--> $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Re-apply the newest migrations to prove they are idempotent
        # Production runs ahead of this repo, so a NEW migration must be safe to
        # apply to a database that already contains objects it did not create,
        # and safe to apply twice.
        #
        # Deliberately not the whole history: the December 2025 migrations
        # target a schema the March 2026 rebuild replaced, so replaying those
        # against a current database fails by design. A migration history is
        # run once, in order, on a fresh database -- only the new ones have to
        # tolerate being re-run.
        run: |
          set -euo pipefail
          # Everything dated 2026-08-07 or later, rather than a literal 20260807
          # glob -- that glob silently stopped covering anything added in a later
          # month, so a new migration got the idempotency check only if it
          # happened to land in the same month as the one this was written in.
          for f in $(ls supabase/migrations/*.sql | sort | awk -F/ '$NF >= "20260807"'); do
            echo "--> re-apply $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Assert behaviour still holds after re-application
        run: |
          set -euo pipefail
          # Every assert file, by glob. Naming two explicitly meant that
          # 03_preferences, 04_definer_privileges and 05_treasury_visibility
          # existed, passed locally, and were never run by the PR gate -- so the
          # only genuinely behavioural coverage in the repo was the part CI
          # skipped. A new NN_*_assert.sql is now picked up automatically.
          shopt -s nullglob
          asserts=(supabase/tests/migrations/[0-9][0-9]_*_assert.sql)
          if [ ${#asserts[@]} -eq 0 ]; then
            echo "::error::No assert files matched. Refusing to report success from an empty set."
            exit 1
          fi
          for f in "${asserts[@]}"; do
            echo "--> $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
